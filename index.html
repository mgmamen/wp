<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LinkTree Mobile Style</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(to bottom, #e0e0ff, #f5f5ff);
      color: #333;
      max-width: 500px;
      margin: auto; /* Biar di desktop tetap kayak tampilan HP */
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .page {
      display: none;
      padding: 40px 20px;
      min-height: 100vh;
      animation: fadeIn 0.3s ease-in-out;
    }

    .active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2 {
      font-size: 22px;
      margin-bottom: 16px;
      text-align: center;
    }

    p {
      font-size: 16px;
      margin-bottom: 20px;
      text-align: center;
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn {
      width: 90%;
      max-width: 400px;
      margin: 10px 0;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      background: linear-gradient(135deg, #6a5acd, #8a2be2);
      color: white;
      border: none;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 16px rgba(0,0,0,0.15);
    }

    /* Agar tidak melebar di desktop */
    html {
      background: #ddd;
    }
  </style>
</head>
<body>

  <!-- Halaman 1: Menu -->
  <div id="page1" class="page active">
    <h1>Selamat Datang 🙏 </h1>
    <p>Pilih menu di bawah ini:</p>
    <div class="menu-container">
      <button class="btn" onclick="showPage(2)">🎬 Alur Cerita</button>
      <button class="btn" onclick="showPage(3)">📌 Facebook Channel</button>
      <button class="btn" onclick="showPage(4)">📌 Join Telegram Channel</button>
      <button class="btn" onclick="showPage(5)">📌 Join WA-Channel</button>
    </div>
  </div>

  <!-- Halaman 2 -->
  <div id="page2" class="page">
    <iframe src="https://mgmamen.github.io/wp/Film-card.html" width="100%" height="300" style="border:none;"></iframe>
    <button class="btn" onclick="showPage(1)">← Kembali</button>
  </div>

  <!-- Halaman 3 -->
  <div id="page3" class="page">

<a href="https://www.facebook.com/share/16mRdrR1dc/" target="_blank" style="text-decoration: none;">
  <button style="
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: #1877F2;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: 0.3s;
  " onmouseover="this.style.backgroundColor='#145DBF'" onmouseout="this.style.backgroundColor='#1877F2'">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="FB" width="24" height="24" />
    Facebook Win Project
  </button>
</a>

    <button class="btn" onclick="showPage(1)">← Kembali</button>
  </div>

  <!-- Halaman 4 -->
  <div id="page4" class="page">
<a href="https://t.me/WPdonghua" target="_blank" style="text-decoration: none;">
  <button style="
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: #229ED9;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: background-color 0.3s;
  " onmouseover="this.style.backgroundColor='#1a86ba'" onmouseout="this.style.backgroundColor='#229ED9'">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" width="24" height="24" />
    Lihat di Telegram
  </button>
</a>
    <button class="btn" onclick="showPage(1)">← Kembali</button>
  </div>

  <!-- Halaman 5 -->
  <div id="page5" class="page">

<a href="https://whatsapp.com/channel/0029Vb66DRlGehERMAPmE701" target="_blank" style="text-decoration: none;">
  <button style="
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: #25D366;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: background-color 0.3s;
  " onmouseover="this.style.backgroundColor='#1ebe5d'" onmouseout="this.style.backgroundColor='#25D366'">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" width="24" height="24" />
    Gabung Channel WhatsApp
  </button>
</a>

    <button class="btn" onclick="showPage(1)">← Kembali</button>
  </div>

  <script>
    function showPage(pageNumber) {
      const pages = document.querySelectorAll('.page');
      pages.forEach(p => p.classList.remove('active'));
      document.getElementById('page' + pageNumber).classList.add('active');
      window.scrollTo(0, 0);
    }
  </script>

</body>
</html>
